# fly.toml app configuration file generated for httphacks on 2026-09-30T13:11:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'httphacks'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = '/app/bin/migrate'
